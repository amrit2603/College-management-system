spring.application.name=college-management

# In-memory H2 database (data resets on every restart)
spring.datasource.url=jdbc:h2:mem:collegedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create/update tables from the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keeps the session open while JSON is written, so lazy collections can be serialized
spring.jpa.open-in-view=true

# Browser DB viewer: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
